<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahfouzPractice - Java IDE</title>
    <!-- Load Monaco Editor Stylesheets -->
    <link rel="stylesheet" data-name="vs/editor/default.css" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3c3c3c;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #4ec9b0;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #1177bb;
        }
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #editor {
            width: 60%;
            height: 100%;
        }
        #output-container {
            width: 40%;
            background-color: #151515;
            border-left: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }
        .output-header {
            background-color: #252526;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #aaaaaa;
            border-bottom: 1px solid #3c3c3c;
        }
        #console-output {
            flex: 1;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #d4d4d4;
        }
    </style>
</head>
<body>

    <header>
        <h1>☕ MahfouzPractice (Java Editor)</h1>
        <button onclick="runJavaCode()">▶ Run Code</button>
    </header>

    <div id="main-container">
        <!-- The Visual Code Editor Window -->
        <div id="editor"></div>

        <!-- The Output Console Window -->
        <div id="output-container">
            <div class="output-header">Console Output</div>
            <div id="console-output">Click "Run Code" to compile...</div>
        </div>
    </div>

    <!-- Load Monaco Editor JavaScript loader dependencies -->
    <script src="https://cloudflare.com"></script>
    <script>
        let editor;

        // Initialize the VS Code style editor window
        require.config({ paths: { 'vs': 'https://cloudflare.com' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: [
                    'public class Main {',
                    '    public static void main(String[] args) {',
                    '        System.out.println("Hello, Mahfouz! Welcome to your Java practice environment.");',
                    '        ',
                    '        int a = 10;',
                    '        int b = 20;',
                    '        System.out.println("The sum of a + b is: " + (a + b));',
                    '    }',
                    '}'
                ].join('\n'),
                language: 'java',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });
        });

        // Browser-level simulation engine to extract prints and math execution loops
        function runJavaCode() {
            const consoleOutput = document.getElementById('console-output');
            consoleOutput.innerHTML = "Compiling and Running...\n";
            
            const rawCode = editor.getValue();
            
            try {
                // Intercept string println commands inside the custom user code block 
                let outputLines = [];
                
                // Parsing logic targeting simple system prints for testing math loops
                const matches = rawCode.match(/System\.out\.println\(([^)]+)\);/g);
                
                if (matches) {
                    // Create an evaluation context to simulate local variables in the script
                    let structuralContext = "";
                    const variableLines = rawCode.match(/(int|double|String)\s+(\w+)\s*=\s*([^;]+);/g);
                    if (variableLines) {
                        variableLines.forEach(v => {
                            let cleanVar = v.replace(/(int|double|String)\s+/, 'let ');
                            structuralContext += cleanVar + "\n";
                        });
                    }

                    matches.forEach(match => {
                        let innerContent = match.slice(19, -2); // strip System.out.println( and );
                        
                        // Convert Java string concatenation (+) safely into JS execution environment
                        let executableSegment = structuralContext ? structuralContext + `outputLines.push(${innerContent});` : `outputLines.push(${innerContent});`;
                        
                        // Execute evaluation block safely
                        eval(executableSegment);
                    });
                    
                    consoleOutput.innerHTML = outputLines.join('\n');
                } else {
                    consoleOutput.innerHTML = "Code executed safely. (No System.out.println commands detected to display output).";
                }
            } catch (error) {
                consoleOutput.innerHTML = "⚠️ Compilation Error:\n" + error.message;
            }
        }
    </script>
</body>
</html>
